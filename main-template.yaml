AWSTemplateFormatVersion: '2010-09-09'
Description: 'High Availability Web Architecture - Team Project (VPC, EC2, ALB, AutoScaling)'

Resources:
  # ==========================================
  # 1. جزء منة: VPC & Networking
  # ==========================================
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ProjectVPC

  # (منة هتضيف هنا الـ Subnets، الـ Internet Gateway، والـ Route Tables)

  # ==========================================
  # 2. جزء هبة: EC2 Launch Template
  # ==========================================
  MyLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties: 
      LaunchTemplateName: WebServerTemplate
      LaunchTemplateData:
        ImageId: ami-0a3c3a20c09d6f377 # Amazon Linux 2023 (us-east-1)
        InstanceType: t2.micro
        UserData: 
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            echo "<h1>Welcome to Our AWS Team Project</h1>" > /var/www/html/index.html

 # ==========================================
  # 3. ALB & Auto Scaling Section
  # ==========================================
  
  # Target Group to connect instances with the Load Balancer
  MyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref MyVPC 
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP

  # Application Load Balancer Configuration
  MyLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !Ref PublicSubnet1 
        - !Ref PublicSubnet2 
      SecurityGroups:
        - !Ref ALBSecurityGroup 
      Scheme: internet-facing

  # ALB Listener for incoming traffic
  MyListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref MyTargetGroup
      LoadBalancerArn: !Ref MyLoadBalancer
      Port: 80
      Protocol: HTTP

  # Auto Scaling Group Configuration
  MyAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1 
        - !Ref PrivateSubnet2 
      LaunchTemplate:
        LaunchTemplateId: !Ref MyLaunchTemplate 
        Version: !GetAtt MyLaunchTemplate.LatestVersionNumber
      MinSize: '2'
      MaxSize: '4'
      TargetGroupARNs:
        - !Ref MyTargetGroup
